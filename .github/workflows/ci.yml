# GitHub Actions CI — AI Training Gym
#
# 每次推送或 PR 时运行：
# 1. 安装依赖
# 2. 检查任务 YAML 格式有效性
# 3. 运行所有任务测试
# 4. 运行基准评测（仅测试模式）

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

# 取消重复的 CI 运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  CACHE_VERSION: 1

jobs:
  # ===========================================================================
  # 检查 & 测试
  # ===========================================================================
  test:
    name: "测试 (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: 🧬 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-json-report  # 用于 benchmark 的 JSON 报告

      - name: ✅ 验证任务格式
        run: |
          python -c "
import os
import yaml

tasks_dir = 'tasks'
errors = []

for task_id in os.listdir(tasks_dir):
    task_path = os.path.join(tasks_dir, task_id)
    yaml_path = os.path.join(task_path, 'task.yaml')

    if not os.path.isdir(task_path):
        continue
    if not os.path.exists(yaml_path):
        errors.append(f'{task_id}: 缺少 task.yaml')
        continue

    with open(yaml_path, 'r', encoding='utf-8') as f:
        try:
            config = yaml.safe_load(f)
        except yaml.YAMLError as e:
            errors.append(f'{task_id}: YAML 解析错误 - {e}')
            continue

    # 验证必填字段
    required = ['id', 'title', 'type', 'difficulty', 'source', 'evaluation', 'description']
    for field in required:
        if field not in config:
            errors.append(f'{task_id}: 缺少必填字段 \"{field}\"')

    # 验证类型
    valid_types = ['code_fix', 'generation', 'classification', 'qa']
    if config.get('type') not in valid_types:
        errors.append(f'{task_id}: 无效的任务类型 \"{config.get(\"type\")}\"')

    # 验证难度
    valid_difficulties = ['easy', 'medium', 'hard']
    if config.get('difficulty') not in valid_difficulties:
        errors.append(f'{task_id}: 无效的难度 \"{config.get(\"difficulty\")}\"')

    # 验证评测指标
    metrics = config.get('evaluation', {}).get('metrics', [])
    if not metrics:
        errors.append(f'{task_id}: 必须至少定义一个评测指标')

if errors:
    print('❌ 格式验证失败:')
    for e in errors:
        print(f'  - {e}')
    exit(1)
else:
    print('✅ 所有任务格式验证通过')
"

      - name: 🔬 运行任务测试
        run: |
          python -m pytest tasks/ -v --tb=short --junitxml=junit.xml -o "junit_family=legacy"
        continue-on-error: false

      - name: 📊 运行基准评测（测试模式）
        run: |
          python scripts/benchmark.py --ci

      - name: 📤 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            junit.xml
            tests/
          retention-days: 14

  # ===========================================================================
  # 代码质量检查
  # ===========================================================================
  lint:
    name: "代码质量"
    runs-on: ubuntu-latest

    steps:
      - name: 🧬 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: 🔍 Flake8 检查
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: ⚫ Black 格式检查
        run: |
          black --check --diff .
        continue-on-error: true

  # ===========================================================================
  # 构建检查
  # ===========================================================================
  build:
    name: "构建检查"
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: 🧬 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 验证 requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements.txt 2>/dev/null || \
          echo "⚠️  dry-run 完成（某些包无法在 dry-run 模式检查）"

      - name: ✅ 最终检查
        run: |
          echo "✅ 所有 CI 检查通过"
          echo "📂 仓库结构:"
          find . -not -path './.git/*' -not -path './**/__pycache__/*' \
                 -not -name '*.pyc' -not -path './venv/*' \
                 -type f | sort
