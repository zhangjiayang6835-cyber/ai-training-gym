# =============================================================================
# AI Training Gym — 任务规范模板 / Task Specification Template
# =============================================================================
# 此文件定义了 AI Training Gym 中所有任务的 YAML 规范。
# 创建新任务时请复制此模板并填充相应字段。
# =============================================================================

# ======== Basic Info ========
# 任务唯一标识符，kebab-case，全局唯一 / Unique kebab-case ID, globally unique
# 示例 / e.g. "sql-injection-fix-001", "math-word-problems-001"
id: "your-task-id-here"

# 任务标题 / Task title, briefly describe the task
# 示例 / e.g. "SQL注入漏洞修复", "数学应用题求解"
title: "您的任务标题"

# 任务类型 / Task type, one of:
#   code_fix       - Code fix task (model outputs fixed code)
#   generation     - Generation task (model outputs text/code)
#   classification - Classification task (model outputs label)
#   qa             - Question answering task
type: "code_fix"  # code_fix | generation | classification | qa

# 难度 / Difficulty
#   easy   - Simple, single step
#   medium - Medium, multi-step reasoning
#   hard   - Hard, requires deep understanding or creative solution
difficulty: "easy"  # easy | medium | hard

# 数据来源 / Data source
source: "training-gym"  # training-gym | honeycode-honeypot | external

# ======== Language Info ========
# 编程语言列表 / Programming languages (required for code_fix)
languages:
  - python
  # - javascript
  # - java
  # - go

# ======== Test Config ========
# 测试用例路径 / Test cases path, relative to tasks/<task-id>/
# Points to directory or file with test data and expected output
test_cases_path: "tests/"

# ======== Evaluation Config ========
evaluation:
  # 评测指标 / Metrics list
  metrics:
    # -- Functional correctness --
    - name: "functional"
      # 权重 / Weight for composite score
      weight: 1.0
      # 指标类型 / Metric type
      type: "pytest"
      # 配置 / Config
      config:
        test_pattern: "tests/test_*.py"
        timeout_seconds: 30

    # -- Exact match (for generation type) --
    - name: "exact_match"
      weight: 1.0
      type: "exact_match"
      config:
        # 是否忽略大小写 / Case insensitive
        case_sensitive: false
        # 是否去除两端空白 / Strip whitespace
        strip: true

    # -- Security (for code_fix type) --
    # - name: "security"
    #   weight: 1.0
    #   type: "static_analysis"
    #   config:
    #     rules:
    #       - "no_string_concatenation_in_query"
    #       - "no_hardcoded_credentials"

    # -- Code quality --
    # - name: "code_quality"
    #   weight: 0.5
    #   type: "lint"
    #   config:
    #     linter: "pylint"
    #     max_warnings: 5

# ======== Tags ========
# 标签 / Tags for classification and search
tags:
  - "python"
  # - "security"
  # - "sql"
  # - "math"

# ======== Reward Config ========
# 虚拟奖励分值 / Virtual reward score (for training signal)
reward_virtual: 0

# ======== Description ========
# 任务描述 / Task description
# Describe the task goal, input/output format, notes
description: |
  # 请在此处填写任务描述。填英文也可以 / Write description here (Chinese or English)
  
  # 格式要求 / Format:
  # - 使用 Markdown / Use Markdown
  # - 说明任务目标 / Describe task goal
  # - 说明输入格式 / Describe input format
  # - 说明期望输出格式 / Describe expected output format
  # - 提供示例 / Provide examples

# ======== Optional Fields ========
# 版本号 / Version
# version: "1.0.0"

# 依赖 / Dependencies
# depends_on:
#   - "some-prerequisite-task"

# 创建日期 / Created at
# created_at: "2025-01-01"

# 更新日期 / Updated at
# updated_at: "2025-01-01"
